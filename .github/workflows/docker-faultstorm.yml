name: Faultstorm tests

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  faultstorm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.6'
      - run: make faultstorm
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: faultstorm-logs
          path: tests/logs/faultstorm
